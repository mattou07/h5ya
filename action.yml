name: Umbraco Login
description: >-
  Authenticates to the Umbraco Management API using OAuth2 client credentials
  and outputs a bearer token for downstream actions to use.
author: h5ya
# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: log-in
  color: blue

# Define your inputs here.
inputs:
  server:
    description: >-
      The base URL of the Umbraco instance (e.g. https://my-site.com or
      my-site.azurewebsites.net).
    required: true
  client-id:
    description: The OAuth2 client ID configured in the Umbraco back-office.
    required: true
  secret:
    description: The OAuth2 client secret.
    required: true

# Define your outputs here.
outputs:
  token:
    description: >-
      The bearer token obtained from the Umbraco Management API. Use as
      `Authorization: Bearer ${{ steps.<id>.outputs.token }}` in downstream
      steps.

runs:
  using: node24
  main: dist/index.js
